name: benchmark

on:
  pull_request:
    paths:
      - 'packages/homeric/lib/src/core/**'
      - 'packages/homeric_text_layout/**'
      - 'examples/benchmark_100k/**'

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'

      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: dart run tools/corpus/generate.dart

      - name: Run benchmark
        run: melos run benchmark

      - name: Compare against baseline
        run: |
          echo "Phase 1 Week 4 TODO: implement perf diff against benchmarks/baseline.json"
          echo "Until then this job is informational only."
