name: ci

# Runs only when a release tag is pushed (tag a main commit, e.g.
# `git tag v1.2.0 && git push origin v1.2.0`), or by hand from the Actions tab.
# PRs and pushes to main no longer start a run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Checkout needs no write access.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format-check

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
