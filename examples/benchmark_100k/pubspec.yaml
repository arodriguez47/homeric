name: benchmark_100k
description: 100k-word benchmark harness for Homeric. Measures cold load, scroll frame times, and Paragraph.layout cost.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  homeric:
    path: ../../packages/homeric
  homeric_markdown:
    path: ../../packages/homeric_markdown
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
