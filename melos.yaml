name: homeric

packages:
  - packages/*
  - packages/homeric/examples/*

command:
  bootstrap:
    environment:
      sdk: ">=3.5.0 <4.0.0"
      flutter: ">=3.24.0"

scripts:
  analyze:
    description: Run `dart analyze` on all packages.
    run: melos exec -c 1 -- "dart analyze --fatal-infos"

  test:
    description: Run all unit + widget tests.
    run: melos exec -c 1 --dir-exists=test -- "flutter test"

  format:
    description: Format all Dart files.
    run: melos exec -c 1 -- "dart format ."

  format-check:
    description: Verify all Dart files are formatted.
    run: melos exec -c 1 -- "dart format --set-exit-if-changed ."

  fuzz-deep:
    description: Opt-in deep property-fuzz run (slow; not part of `melos run test`).
    run: melos exec -c 1 --scope=homeric -- "HOMERIC_DEEP_FUZZ=1 flutter test test/property"

  benchmark:
    description: Run the local macOS profile benchmark matrix.
    run: dart run benchmarks/run.dart
