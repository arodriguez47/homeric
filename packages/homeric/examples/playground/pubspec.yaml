name: homeric_playground
description: >-
  Interactive Flutter app exercising Homeric's Phase 1/2 editing primitives:
  every transaction builder, decoration kind, and reveal-on-selection, driven
  by hand through HomericParagraph.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  homeric:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
